name: 🐛 Bug Report
description: Create a structured report to help us identify and fix bugs.
title: "[BUG]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        *Note: Our AI assistant will automatically scan this submission for duplicates.*
  
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is. Please include what you expected to happen versus what actually happened.
      placeholder: When I attempt to log in using the main dashboard, the authentication screen completely freezes...
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exactly what steps should we take to see this bug in action?
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: System & Environment
      description: What OS, browser, or framework versions are you using?
      placeholder: e.g., Ubuntu 22.04, Chrome 115, Python 3.11
    validations:
      required: false

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Pre-flight Check
      options:
        - label: I have searched the existing issues and believe this is not a duplicate.
          required: true